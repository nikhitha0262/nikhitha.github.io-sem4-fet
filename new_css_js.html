<!DOCTYPE html>
<html>

<head>

<title>Digital Clock</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to right,#141e30,#243b55);
    font-family:Arial,sans-serif;
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    width:350px;
}

h1{
    color:navy;
    margin-bottom:20px;
}

#clock{
    font-size:40px;
    font-weight:bold;
    color:#243b55;
    margin-bottom:20px;
}

#date{
    font-size:18px;
    color:gray;
    margin-bottom:25px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:navy;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#001f5c;
}

a{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    background:#243b55;
    color:white;
    padding:10px 20px;
    border-radius:8px;
}

a:hover{
    background:#141e30;
}

</style>

</head>

<body>

<div class="container">

<h1> Digital Clock</h1>

<div id="clock">00:00:00</div>

<div id="date">Loading Date...</div>

<button onclick="changeColor()">
Change Background
</button>

<br>

<a href="index.html">Home Page</a>

</div>

<script>

function updateClock(){

    let now = new Date();

    let hours = now.getHours();

    let minutes = now.getMinutes();

    let seconds = now.getSeconds();

    if(hours < 10){
        hours = "0" + hours;
    }

    if(minutes < 10){
        minutes = "0" + minutes;
    }

    if(seconds < 10){
        seconds = "0" + seconds;
    }

    let currentTime =
    hours + ":" + minutes + ":" + seconds;

    document.getElementById("clock").innerHTML =
    currentTime;

    document.getElementById("date").innerHTML =
    now.toDateString();
}

setInterval(updateClock,1000);

updateClock();

function changeColor(){

    let colors = [
        "#141e30",
        "#4b0082",
        "#0f766e",
        "#7c2d12",
        "#1e3a8a"
    ];

    let randomColor =
    colors[Math.floor(Math.random()*colors.length)];

    document.body.style.background = randomColor;
}

</script>

</body>

</html>
