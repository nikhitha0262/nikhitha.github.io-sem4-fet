<!DOCTYPE html>
<html>

<head>
<title>JavaScript Assignment 4</title>

<style>

body{
    font-family: Arial;
    background: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container{
    background: white;
    padding: 20px;
    border-radius: 8px;
    width: 350px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    text-align: center;
}

input{
    width: 90%;
    padding: 8px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button{
    width: 95%;
    padding: 10px;
    background: #0284c7;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

button:hover{
    background: #0369a1;
}

.output{
    margin-top: 15px;
    background: #e0f2fe;
    padding: 10px;
    border-radius: 5px;
}

a{
    display: inline-block;
    margin-top: 15px;
    text-decoration: none;
    color: blue;
}

</style>

</head>

<body>

<div class="container">

<h2>Simple Calculator</h2>

<input type="number" id="num1" placeholder="Enter First Number">

<input type="number" id="num2" placeholder="Enter Second Number">

<button onclick="addNumbers()">Add Numbers</button>

<div class="output" id="result"></div>

<br>

<a href="index.html">Home Page</a>

</div>

<script>

function addNumbers()
{
    let n1 = Number(document.getElementById("num1").value);

    let n2 = Number(document.getElementById("num2").value);

    let sum = n1 + n2;

    document.getElementById("result").innerHTML =
    "<strong>Result:</strong> " + sum;
}

</script>

</body>

</html>
