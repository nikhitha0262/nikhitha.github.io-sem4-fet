<!DOCTYPE html>
<html>

<head>

<title>JavaScript Assignment 5</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
    font-family: Arial, sans-serif;
    background:#f4f4f4;
}

h1{
    color: navy;
}

.buttons{
    display:flex;
    gap:10px;
}

.container{
    position: relative;
    width: 220px;
    height: 220px;
}

.box{
    width: 220px;
    height: 220px;
    position: absolute;
    border: 2px solid black;
    border-radius: 10px;
    transition: all 0.3s ease;
    z-index: 1;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:22px;
    font-weight:bold;
}

#red{
    background-color: #ff4d4d;
}

#blue{
    background-color: #4d94ff;
}

#green{
    background-color: #4CAF50;
}

button{
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
    border:none;
    border-radius:6px;
    background: navy;
    color:white;
}

button:hover{
    background:#001f5c;
}

a{
    background: navy;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
}

a:hover{
    background:#001f5c;
}

</style>

</head>

<body>

<h1>Nikhitha Portfolio</h1>

<div class="buttons">

<button onclick="bringToFront('red')">Show Name</button>

<button onclick="bringToFront('blue')">Show Course</button>

<button onclick="bringToFront('green')">Show Skill</button>

</div>

<div class="container">

<div id="red" class="box">Nikhitha</div>

<div id="blue" class="box">CSE Student</div>

<div id="green" class="box">Frontend Developer</div>

</div>

<br>

<a href="index.html">Home Page</a>

<script>

let topLayer = 10;

function bringToFront(id)
{
    const targetBox = document.getElementById(id);

    topLayer++;

    targetBox.style.zIndex = topLayer;
}

</script>

</body>

</html>
